services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codex
      POSTGRES_USER: codex_user
      POSTGRES_PASSWORD: codex_password
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: "/chroma/data"
      CHROMA_DB_IMPL: duckdb+parquet
    volumes:
      - ./data/chroma:/data

  mock-llm:
    build:
      context: ./mock-llm
      dockerfile: Dockerfile
    ports:
      - "5555:5555"

  server:
    image: codex/server
    depends_on:
      - db
      - chroma
    ports:
      - "8000:8000"
    volumes:
      - ./data/documents:/app/documents
      - ./data/pictures:/app/pictures
    environment:
      APP_MAIL: <noreply-email>
      MAIL_PASSWORD: <noreply-email-password>
      APP_MAIL_SMTP_SERVER: <noreply-email-server>
      APP_MAIL_SMTP_PORT: <noreply-email-smtp-port>
      JWT_SECRET: <make-up-your-own>
      CLIENT_SECRET: <google-client-id>
      CLIENT_ID: <google-client-secret>
      CLIENT_BASE_URL: <url-of-client>
      DATABASE_URL: "postgresql://codex_user:codex_password@db:5432/codex"
      CHROMA_PORT: 8000
      CHROMA_HOST: chroma
      ADMIN_EMAIL: <admin-email>
      ADMIN_USERNAME: <admin-username>
      ADMIN_PASSWORD: <admin-password>
      OPENAI_API_KEY: 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
      EMAIL_VERIFICATION_REQUIRED: false
